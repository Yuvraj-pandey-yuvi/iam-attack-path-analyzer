[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iampath"
version = "0.1.0"
description = "Offline AWS IAM privilege-escalation path analyzer"
requires-python = ">=3.14"
dependencies = ["boto3", "networkx"]

[project.scripts]
iampath = "iampath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["iampath"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
