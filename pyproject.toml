[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iampath"
version = "0.1.0"
description = "Offline AWS IAM privilege-escalation path analyzer"
requires-python = ">=3.11"
dependencies = ["boto3", "networkx"]

[project.scripts]
iampath = "iampath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
